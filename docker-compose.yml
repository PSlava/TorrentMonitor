services:
  torrentmonitor:
    image: slashp/torrentmonitor:latest
    build: .
    container_name: torrentmonitor
    ports:
      - "8080:80"
    volumes:
      - tm-data:/var/www/html/data
      - tm-torrents:/var/www/html/torrents
    environment:
      - DB_TYPE=sqlite
    restart: unless-stopped

  # Обход Cloudflare для трекеров с «проверкой браузера» (сейчас это kinozal.me).
  # Поднимается отдельно: docker compose --profile cloudflare up -d
  # После запуска: Настройки → Расширенные → FlareSolverr / Byparr URL = http://byparr:8191
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    profiles: ["cloudflare"]
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

volumes:
  tm-data:
  tm-torrents:
